- baseInfo:
    api_name: 删除购物车商品
    url: /coupApply/cms/delCart
    method: post
    header:
      Content-Type: application/x-www-form-urlencoded
  testCase:
    - case_name: 正常删除购物车商品
      data:
        productId: ${get_extract_data(goodsId,1)}
        timeStamp: ${timestamp()}
      validation:
        - eq: { 'error_code': '0000' }
        - eq: { 'message': 'success' }
