    cookies: ${get_extract_data(Cookie)}
  testCase:
    - case_name: 正常创建应付对账单
      json:
        billName: 自动化对账单
        dataType: 2
        costBillStatus: 1
        dataValue: ${get_extract_data(scheduleNo)}
        ids:
          - ${get_extract_data(chargeId)}
      validation:
        - eq: { 'code': 20000 }
        - eq: { 'message': '操作成功' }
      extract:
        costBillId: $.reconciliationNum

