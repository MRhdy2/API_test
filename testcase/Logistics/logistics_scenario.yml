- baseInfo:
    api_name: 物流公司拆分订单
    url: /api/order/pc/logisticsOrder/handSplitOrder
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(Cookie)}
  testCase:
    - case_name: 物流公司正常拆分订单
      json:
        list:
          - itemId: ${get_extract_data(splitItemId)}
            itemNum: 100
            splitNum: 50
        logisticsOrderId: ${get_extract_data(logisticsOrderId)}
      validation:
        - eq: { 'code': 20000 }
        - eq: { 'logisticsStatus': '1' }

- baseInfo:
