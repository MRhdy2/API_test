- baseInfo:
    api_name: 获取调度单页面列表
    url: /api/order/pc/schedule/findPage
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(Cookie)}
  testCase:
    - case_name: 按调度单号查询列表
      json:
        current: 1
        size: 20
        scheduleMapStatus: 1
        dataType: "2"
        dataValue: ${get_extract_data(scheduleNo)}
      validation:
        - eq: { 'code': 20000 }
        - eq: { 'message': '操作成功' }
      extract:
        scheduleRecordId: $.data.records[0].id
        chargeId: $.data.records[0].chargeId

- baseInfo:
    api_name: 获取调度单详情
    url: /api/order/pc/scheduleDetail/info
