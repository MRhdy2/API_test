- baseInfo:
    api_name: 获取下单物料信息
    url: /api/order/customer/orderPlan/getMaterial
    method: get
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(Cookie)}
  testCase:
    - case_name: 获取可下单物料列表
      validation:
        - eq: { 'code': 20000 }
        - eq: { 'message': '操作成功' }
      extract_list:
        materialIds: $.material[*]

- baseInfo:
    api_name: 货主下订单
    url: /api/order/customer/orderPlan/create
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(Cookie)}
  testCase:
    - case_name: 货主使用物料正常下单
      json:
        orderInfo:
          template: define
          urgentType: 2
          cusName: 总仓
          orderType: 1
          charter: 2
          planType: 1
          transStartTime: ${start_time()}
          transEndTime: ${end_time()}
          orderMark: 自动化测试货主下单
          cusId: "1661242770195464193"
        orderCapacityList:
          - materialCategoryId: ${get_extract_data(materialIds,1)}
            materialCategory: 粮食
            materialName: 小麦
            materialUnit: KG
            materialUnitId: "1660891402561581058"
            settlementUnit: KG
            syncMaterialId: "4"
            materialId: "1661349087048306690"
            sendCusId: "1661663745663741954"
            sendCusName: 码头尖庄仓
            receiveCusId: "1661624733406285825"
            receiveCusName: 502车间
            sendAdrId: "1674617286107828226"
            sendAdrName: 长宁县五谷粮食购销有限责任公司
            receiveAdrId: "1674208708683337730"
            receiveAdrName: 五区一区
            materialSpecId: "1661349088147214337"
            specName: "1"
            materialNum: 100
            materialSpecUnit: KG
            remark: 原粮
        orderVehicleList: []
        orderBoxList: []
      validation:
        - eq: { 'code': 20000 }
        - eq: { 'message': '操作成功' }
      extract:
        logisticsOrderNo: $.orderNo
        logisticsItemId: $.itemId

- baseInfo:
    api_name: 集团接收货主订单
    url: /api/order/pc/order/master/receive
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(Cookie)}
  testCase:
    - case_name: 集团正常接单
      json:
        orderId: ${get_extract_data(logisticsOrderNo)}
        times: ${timestamp()}
      validation:
        - eq: { 'code': 20000 }
        - eq: { 'data': true }

- baseInfo:
    api_name: 集团分配订单给物流公司
    url: /api/order/pc/order/assign
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(Cookie)}
  testCase:
    - case_name: 集团正常分配物流公司
      json:
        orderId: ${get_extract_data(logisticsOrderNo)}
        orgId: "4140913758110176843"
        times: ${timestamp()}
      validation:
        - eq: { 'code': 20000 }
        - eq: { 'message': '操作成功' }

- baseInfo:
    api_name: 物流公司接单
    url: /api/order/pc/order/trans/receive
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(Cookie)}
  testCase:
    - case_name: 物流公司正常接单
      json:
        orderId: ${get_extract_data(logisticsOrderNo)}
